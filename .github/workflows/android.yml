name: Build JARVIS - Persian Voice Commands and Turkish TTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Flutter project
        run: flutter create --platforms=android jarvis_app

      - name: Install offline packages
        working-directory: jarvis_app
        run: |
          flutter pub add flutter_tts
          flutter pub add vosk_flutter
          flutter pub add llama_flutter_android
          flutter pub add path_provider
          # vosk_flutter 0.3.48 requires permission_handler ^10.x, so adding
          # v12 directly causes Pub's version solver to fail. Let the other
          # packages resolve first, then apply a deliberate override below.
          flutter pub get

      - name: Override obsolete Vosk permission dependency
        working-directory: jarvis_app
        run: |
          cat >> pubspec.yaml <<'PUBSPEC'

          dependency_overrides:
            # Vosk 0.3.48 pins the old API, whose Android implementation fails
            # on modern Flutter because it uses PluginRegistry.Registrar.
            permission_handler: 12.0.3
          PUBSPEC
          flutter pub get

      - name: Fix Vosk Android namespace for modern Gradle
        working-directory: jarvis_app
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          files = list(Path.home().glob('.pub-cache/hosted/pub.dev/vosk_flutter-*/android/build.gradle*'))
          if not files:
              raise SystemExit('Could not find vosk_flutter Android build.gradle in Pub cache')
          for gradle in files:
              content = gradle.read_text()

              # Add namespace if the legacy plugin does not declare one.
              if not re.search(r"\bnamespace\s+[\'\"]", content):
                  manifest = gradle.parent / 'src/main/AndroidManifest.xml'
                  package_name = None
                  if manifest.exists():
                      match = re.search(r"<manifest\b[^>]*\bpackage=[\'\"]([^\'\"]+)", manifest.read_text())
                      if match:
                          package_name = match.group(1)
                  if not package_name:
                      package_name = 'com.alphacephei.vosk_flutter'
                  content, count = re.subn(
                      r'\bandroid\s*\{',
                      lambda m: m.group(0) + f'\n    namespace "{package_name}"',
                      content, count=1
                  )
                  if count != 1:
                      raise SystemExit(f'Could not insert namespace into {gradle}')
                  print(f'Added namespace {package_name} to {gradle}')

              # Vosk 0.3.48 hard-codes compileSdk 33, but its AndroidX dependencies
              # require API 34+. Update compileSdk even if namespace already exists.
              # Handle Groovy and Kotlin-style assignments, with or without '=':
              # compileSdkVersion 33, compileSdkVersion = 33, compileSdk = 33.
              # Rewrite the actual assignment line whether it uses a numeric
              # value or a Flutter variable, e.g. compileSdkVersion 33 or
              # compileSdk = flutter.compileSdkVersion.
              updated, count = re.subn(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)([^\s;]+)',
                  r'\g<1>35', content
              )
              if count == 0:
                  updated, count = re.subn(
                      r'(?m)(\bandroid\s*\{)',
                      r'\g<1>\n    compileSdkVersion 35', content, count=1
                  )
              if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?35\b', updated):
                  raise SystemExit(f'Could not set/verify compileSdk 35 in {gradle}')
              gradle.write_text(updated)
              print(f'Updated Vosk plugin compileSdk to 35: {gradle}')

      - name: Download bundled offline models (resume on connection drops)
        working-directory: jarvis_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models

          download_with_resume() {
            local url="$1"
            local dest="$2"
            local attempt=1
            touch "${dest}.part"
            while [ "$attempt" -le 10 ]; do
              echo "Download attempt ${attempt}/10: ${dest}"
              if curl --location --fail --show-error --connect-timeout 30 \
                --continue-at - --output "${dest}.part" "$url"; then
                mv "${dest}.part" "$dest"
                return 0
              fi
              echo "Connection interrupted; keeping partial file and retrying..."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "ERROR: Download failed after 10 attempts: ${dest}" >&2
            return 1
          }

          download_with_resume \
            'https://huggingface.co/rhasspy/vosk-models/resolve/main/fa/vosk-model-small-fa-0.5.zip' \
            'assets/models/vosk-model-small-fa-0.5.zip'
          download_with_resume \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/df5bf01389a39c743ab467d734bf501681e041c5/qwen2.5-0.5b-instruct-q4_k_m.gguf' \
            'assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf'

          test "$(stat -c%s assets/models/vosk-model-small-fa-0.5.zip)" -gt 50000000
          test "$(stat -c%s assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf)" -gt 400000000

      - name: Configure offline assets and Android permissions
        working-directory: jarvis_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pub = Path('pubspec.yaml')
          s = pub.read_text()
          if 'assets/models/vosk-model-small-fa-0.5.zip' not in s:
              s = s.replace(
                  'flutter:\n  uses-material-design: true',
                  'flutter:\n  uses-material-design: true\n  assets:\n    - assets/models/vosk-model-small-fa-0.5.zip\n    - assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf'
              )
          pub.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'xmlns:tools=' not in s:
              s = s.replace('xmlns:android="http://schemas.android.com/apk/res/android"',
                            'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"', 1)
          # Ensure both permissions are present in the final merged manifest.
          s = re.sub(r'\s*<uses-permission android:name="android\.permission\.INTERNET"[^>]*/>', '', s)
          s = re.sub(r'\s*<uses-permission android:name="android\.permission\.RECORD_AUDIO"[^>]*/>', '', s)
          s = s.replace('<application',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.READ_CONTACTS" />\n'
              '    <uses-permission android:name="android.permission.CALL_PHONE" />\n'
              '    <queries><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries>\n'
              '    <application', 1)
          manifest.write_text(s)

          # Vosk's Android release builds need JNA keep rules.
          proguard = Path('android/app/proguard-rules.pro')
          proguard.parent.mkdir(parents=True, exist_ok=True)
          rules = proguard.read_text() if proguard.exists() else ''
          required = (
              '-keep class com.sun.jna.** { *; }\n'
              '-keepclassmembers class * extends com.sun.jna.** { *; }\n'
              # JNA contains optional desktop AWT references that do not exist on Android.
              '-dontwarn java.awt.**\n'
          )
          for rule in required.splitlines():
              if rule not in rules.splitlines():
                  rules += ('\n' if rules and not rules.endswith('\n') else '') + rule + '\n'
          proguard.write_text(rules)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
              gradle.write_text(g)
          PY

      - name: Add Android bridge for launching apps and calling contacts
        working-directory: jarvis_app
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/jarvis_app
          cat > android/app/src/main/kotlin/com/example/jarvis_app/MainActivity.kt <<'KOTLIN'
          package com.example.jarvis_app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.provider.ContactsContract
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
            private val channelName = "jarvis/device"

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                when (call.method) {
                  "launchApp" -> {
                    val name = call.argument<String>("name")?.trim().orEmpty()
                    result.success(launchApp(name))
                  }
                  "goHome" -> {
                    val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                    intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    startActivity(intent)
                    result.success(mapOf("ok" to true, "message" to "به صفحهٔ اصلی برگشتم."))
                  }
                  "callContact" -> {
                    val name = call.argument<String>("name")?.trim().orEmpty()
                    result.success(callContact(name))
                  }
                  else -> result.notImplemented()
                }
              }
            }

            private fun normalize(value: String): String = value.lowercase().trim()
              .replace("ي", "ی").replace("ك", "ک")
              .replace(Regex("\\s+"), " ")

            private fun launchApp(query: String): Map<String, Any> {
              if (query.isBlank()) return mapOf("ok" to false, "message" to "نام برنامه را متوجه نشدم.")
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              val apps = packageManager.queryIntentActivities(intent, 0)
              val q = normalize(query)
              val match = apps.firstOrNull { normalize(it.loadLabel(packageManager).toString()) == q }
                ?: apps.firstOrNull { normalize(it.loadLabel(packageManager).toString()).contains(q) }
                ?: apps.firstOrNull { q.contains(normalize(it.loadLabel(packageManager).toString())) && normalize(it.loadLabel(packageManager).toString()).length > 2 }
              if (match == null) return mapOf("ok" to false, "message" to "برنامهٔ «$query» را پیدا نکردم. نامش را دقیق‌تر بگو.")
              val launch = packageManager.getLaunchIntentForPackage(match.activityInfo.packageName)
                ?: return mapOf("ok" to false, "message" to "برای این برنامه امکان بازکردن پیدا نشد.")
              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              startActivity(launch)
              return mapOf("ok" to true, "message" to "برنامهٔ ${match.loadLabel(packageManager)} را باز کردم.")
            }

            private fun callContact(query: String): Map<String, Any> {
              if (query.isBlank()) return mapOf("ok" to false, "message" to "نام مخاطب را متوجه نشدم.")
              if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                return mapOf("ok" to false, "permission" to "contacts", "message" to "برای پیدا کردن مخاطب، اجازهٔ مخاطبین لازم است.")
              }
              val cursor = contentResolver.query(
                ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?",
                arrayOf("%$query%"),
                "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} ASC"
              )
              var displayName: String? = null
              var number: String? = null
              cursor?.use {
                if (it.moveToFirst()) {
                  displayName = it.getString(0)
                  number = it.getString(1)
                }
              }
              if (number.isNullOrBlank()) return mapOf("ok" to false, "message" to "مخاطبی با نام «$query» و شمارهٔ قابل‌استفاده پیدا نکردم.")
              if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                return mapOf("ok" to false, "permission" to "phone", "message" to "برای برقراری مستقیم تماس، اجازهٔ تماس تلفنی لازم است.")
              }
              return try {
                val callIntent = Intent(Intent.ACTION_CALL, Uri.parse("tel:${number!!.replace(" ", "")}"))
                callIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                startActivity(callIntent)
                mapOf("ok" to true, "message" to "در حال تماس با ${displayName ?: query}.")
              } catch (e: SecurityException) {
                mapOf("ok" to false, "message" to "اندروید اجازهٔ شروع تماس را نداد. مجوز تماس را بررسی کن.")
              }
            }
          }
          KOTLIN

      - name: Write JARVIS app
        working-directory: jarvis_app
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:llama_flutter_android/llama_flutter_android.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:vosk_flutter/vosk_flutter.dart';

          const cyan = Color(0xFF00E5FF);
          const blue = Color(0xFF168CFF);
          const bg = Color(0xFF030914);
          const panel = Color(0xFF0A1929);
          const llmAsset = 'assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf';
          const voskAsset = 'assets/models/vosk-model-small-fa-0.5.zip';

          void main() => runApp(const JarvisApp());

          class JarvisApp extends StatelessWidget {
            const JarvisApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'JARVIS فارسی با صدای ترکی',
              theme: ThemeData(
                brightness: Brightness.dark,
                scaffoldBackgroundColor: bg,
                colorScheme: ColorScheme.fromSeed(seedColor: cyan, brightness: Brightness.dark),
                useMaterial3: true,
              ),
              home: const ChatPage(),
            );
          }

          class ChatPage extends StatefulWidget {
            const ChatPage({super.key});
            @override
            State<ChatPage> createState() => _ChatPageState();
          }

          class _ChatPageState extends State<ChatPage> with SingleTickerProviderStateMixin {
            final input = TextEditingController();
            final scroll = ScrollController();
            final tts = FlutterTts();
            static const deviceChannel = MethodChannel('jarvis/device');
            final llama = LlamaController();
            final vosk = VoskFlutterPlugin.instance();
            final modelLoader = ModelLoader();
            final messages = <Map<String, String>>[
              {'from': 'jarvis', 'text': 'سلام! من جارویس فارسی هستم. مدل‌های آفلاین در حال آماده‌سازی هستند.'}
            ];
            final chatHistory = <ChatMessage>[];
            late final AnimationController pulse;
            Model? speechModel;
            Recognizer? recognizer;
            SpeechService? speechService;
            StreamSubscription<dynamic>? resultSubscription;
            StreamSubscription<dynamic>? partialSubscription;
            bool listening = false;
            bool thinking = false;
            bool modelsReady = false;
            String systemStatus = 'در حال بارگذاری مدل‌های آفلاین';
            String speechError = ''; 

            @override
            void initState() {
              super.initState();
              pulse = AnimationController(vsync: this, duration: const Duration(milliseconds: 2200))..repeat(reverse: true);
              tts.setSpeechRate(0.46);
              tts.setPitch(1.0);
              initializeOfflineModels();
            }

            Future<void> initializeOfflineModels() async {
              // Prepare speech independently: a Vosk error must not block typed chat.
              try {
                if (mounted) setState(() => systemStatus = 'آماده‌سازی مدل گفتار فارسی');
                final voskPath = await modelLoader.loadFromAssets(voskAsset);
                speechModel = await vosk.createModel(voskPath);
                recognizer = await vosk.createRecognizer(model: speechModel!, sampleRate: 16000);
                speechService = await vosk.initSpeechService(recognizer!);
                resultSubscription = speechService!.onResult().listen((event) {
                  final text = extractRecognizedText(event.toString());
                  if (text.isNotEmpty && listening && mounted) {
                    setState(() => listening = false);
                    speechService?.stop();
                    input.text = text;
                    input.selection = TextSelection.collapsed(offset: input.text.length);
                    send();
                  }
                }, onError: (Object e) {
                  speechError = e.toString();
                  if (mounted) setState(() => systemStatus = 'خطا در تشخیص گفتار');
                });
                partialSubscription = speechService!.onPartial().listen((event) {
                  final text = extractRecognizedText(event.toString());
                  if (text.isNotEmpty && listening && mounted) {
                    input.text = text;
                    input.selection = TextSelection.collapsed(offset: input.text.length);
                  }
                }, onError: (Object e) { speechError = e.toString(); });
                if (mounted) setState(() => systemStatus = 'مدل گفتار آماده است؛ بارگذاری مدل زبانی');
              } catch (e) {
                speechError = e.toString();
                if (mounted) {
                  setState(() => systemStatus = 'خطای گفتار: ${e.toString()}');
                  addMessage('jarvis', 'راه‌اندازی میکروفون ناموفق بود: $speechError');
                }
              }

              // Load the language model separately so speech initialization errors
              // cannot prevent the rest of the assistant from starting.
              try {
                if (mounted) setState(() => systemStatus = speechService == null
                    ? 'بارگذاری مدل زبانی محلی؛ گفتار در دسترس نیست'
                    : 'آماده‌سازی مدل زبانی محلی');
                final directory = await getApplicationSupportDirectory();
                final modelFile = File('${directory.path}/qwen2.5-0.5b-instruct-q4_k_m.gguf');
                if (!await modelFile.exists() || await modelFile.length() < 400000000) {
                  final data = await rootBundle.load(llmAsset);
                  await modelFile.writeAsBytes(data.buffer.asUint8List(data.offsetInBytes, data.lengthInBytes), flush: true);
                }
                final gpu = await llama.detectGpu();
                await llama.loadModel(
                  modelPath: modelFile.path,
                  threads: 4,
                  contextSize: 2048,
                  gpuLayers: gpu.recommendedGpuLayers,
                );
                chatHistory.add(ChatMessage(role: 'system', content: 'تو JARVIS، دستیار شخصی فارسی هستی. همیشه متن پاسخ را فقط به فارسی روان، کوتاه و مفید بنویس؛ کاربر متن فارسی می‌خواهد. اگر پاسخ را نمی‌دانی، صادقانه بگو. ادعا نکن که به امکانات گوشی دسترسی داری یا کاری را انجام داده‌ای مگر واقعاً انجام شده باشد. تمام پردازش‌ها روی همین دستگاه انجام می‌شوند.'));
                if (!mounted) return;
                setState(() { modelsReady = true; systemStatus = speechService == null ? 'مدل زبانی آماده؛ گفتار غیرفعال' : 'کاملاً آفلاین و آماده'; });
                addMessage('jarvis', speechService == null
                    ? 'مدل زبانی آماده است، اما تشخیص گفتار راه‌اندازی نشد. فعلاً از کادر تایپ استفاده کن. جزئیات خطای گفتار: $speechError'
                    : 'مدل‌های محلی بارگذاری شدند. متن پاسخ‌ها فارسی می‌ماند و صدای پاسخ به ترکی استانبولی تبدیل می‌شود.');
              } catch (e) {
                if (!mounted) return;
                setState(() => systemStatus = 'مدل زبانی بارگذاری نشد');
                addMessage('jarvis', 'بارگذاری مدل زبانی انجام نشد. جزئیات: $e');
              }
            }

            String extractRecognizedText(String raw) {
              try {
                final value = jsonDecode(raw);
                if (value is Map) return (value['text'] ?? value['partial'] ?? '').toString().trim();
              } catch (_) {}
              return raw.trim();
            }

            @override
            void dispose() {
              resultSubscription?.cancel();
              partialSubscription?.cancel();
              speechService?.stop();
              llama.dispose();
              pulse.dispose(); input.dispose(); scroll.dispose(); tts.stop();
              super.dispose();
            }

            void addMessage(String from, String text) {
              if (!mounted) return;
              setState(() => messages.add({'from': from, 'text': text}));
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (scroll.hasClients) scroll.animateTo(scroll.position.maxScrollExtent, duration: const Duration(milliseconds: 300), curve: Curves.easeOut);
              });
            }

            Future<bool> handleDeviceCommand(String raw) async {
              final q = raw.toLowerCase().replaceAll('ي', 'ی').replaceAll('ك', 'ک').replaceAll('‌', ' ').trim();
              final homePhrases = ['برگرد صفحه اصلی', 'برو صفحه اصلی', 'برو به صفحه اصلی', 'صفحه اصلی', 'این برنامه رو ببند', 'این برنامه را ببند', 'جارویس رو ببند', 'جارویس را ببند'];
              if (homePhrases.any(q.contains)) {
                try {
                  final result = await deviceChannel.invokeMapMethod<String, dynamic>('goHome');
                  final reply = (result?['message'] ?? 'به صفحهٔ اصلی برگشتم.').toString();
                  addMessage('jarvis', reply);
                } catch (e) {
                  addMessage('jarvis', 'نتوانستم صفحهٔ اصلی را باز کنم: $e');
                }
                return true;
              }

              final callMatch = RegExp(r'(?:به|با)\s+(.+?)\s+(?:زنگ بزن|زنگ بزنید|تماس بگیر|تماس بزن|تماس بگیرید)').firstMatch(q);
              if (callMatch != null) {
                final contact = callMatch.group(1)!.replaceAll(RegExp(r'^(?:آقای|اقای|خانم|مخاطب)\s+'), '').trim();
                try {
                  var contacts = await Permission.contacts.status;
                  if (!contacts.isGranted) contacts = await Permission.contacts.request();
                  if (!contacts.isGranted) {
                    addMessage('jarvis', 'برای پیدا کردن مخاطب، مجوز مخاطبین را از تنظیمات گوشی فعال کن.');
                    return true;
                  }
                  var phone = await Permission.phone.status;
                  if (!phone.isGranted) phone = await Permission.phone.request();
                  if (!phone.isGranted) {
                    addMessage('jarvis', 'برای تماس مستقیم، مجوز تماس تلفنی را فعال کن.');
                    return true;
                  }
                  final result = await deviceChannel.invokeMapMethod<String, dynamic>('callContact', {'name': contact});
                  final reply = (result?['message'] ?? 'فرمان تماس انجام نشد.').toString();
                  addMessage('jarvis', reply);
                  if (result?['ok'] != true && mounted) await speak(reply);
                } catch (e) {
                  addMessage('jarvis', 'در اجرای فرمان تماس خطایی رخ داد: $e');
                }
                return true;
              }

              final closeOther = RegExp(r'^(.+?)\s+(?:رو|را)\s+ببند$').firstMatch(q);
              if (closeOther != null && !q.contains('این برنامه') && !q.contains('جارویس')) {
                addMessage('jarvis', 'اندروید اجازه نمی‌دهد برنامهٔ «${closeOther.group(1)}» را به‌زور متوقف کنم. می‌توانم آن را باز کنم یا تو از صفحهٔ برنامه‌های اخیر ببندیش.');
                return true;
              }

              final openMatch = RegExp(r'^(.+?)\s+(?:رو|را)\s+(?:باز کن|بازش کن|اجرا کن|راه اندازی کن)$').firstMatch(q);
              if (openMatch != null) {
                var appName = openMatch.group(1)!.trim();
                appName = appName.replaceFirst(RegExp(r'^(?:جارویس\s+)?(?:برنامه|اپلیکیشن|اپ)\s+'), '').trim();
                try {
                  final result = await deviceChannel.invokeMapMethod<String, dynamic>('launchApp', {'name': appName});
                  final reply = (result?['message'] ?? 'نتوانستم برنامه را باز کنم.').toString();
                  addMessage('jarvis', reply);
                  if (result?['ok'] != true && mounted) await speak(reply);
                } catch (e) {
                  addMessage('jarvis', 'بازکردن برنامه ناموفق بود: $e');
                }
                return true;
              }
              return false;
            }

            String offlineAnswer(String raw) {
              final q = raw.toLowerCase().trim();
              if (q.contains('سلام') || q.contains('درود')) return 'سلام! آماده‌ام. چه کاری برایت انجام بدهم؟';
              if (q.contains('اسمت') || q.contains('نامت') || q.contains('معرفی کن') || q.contains('خودت را معرفی') || q.contains('خودتو معرفی')) return 'سلام! من JARVIS هستم؛ دستیار شخصی فارسی شما. برای حفظ حریم خصوصی، تلاش می‌کنم پردازش‌ها را روی خود گوشی انجام بدهم و در حال حاضر می‌توانم به پرسش‌ها پاسخ بدهم و فرمان‌های پایه را اجرا کنم.';
              if (q.contains('ساعت')) { final n = DateTime.now(); return 'ساعت دستگاه ${n.hour}:${n.minute.toString().padLeft(2, '0')} است.'; }
              if (q.contains('تاریخ')) { final n = DateTime.now(); return 'تاریخ دستگاه: ${n.year}/${n.month}/${n.day}'; }
              if (q.contains('وضعیت')) return 'هسته جارویس فعال است. حالت اجرا: کاملاً آفلاین. مدل زبانی: ${modelsReady ? 'آماده' : 'در حال بارگذاری'}.';
              if (q.contains('راهنما') || q.contains('چه کار')) return 'می‌توانم به کمک مدل محلی به سؤال‌ها پاسخ بدهم و ساعت و تاریخ دستگاه را اعلام کنم. برای گفتار فارسی، مدل آفلاین گفتار نیز همراه برنامه است.';
              if (q.contains('خداحافظ')) return 'خداحافظ! هر زمان نیاز داشتی برگرد.';
              return 'مدل زبانی هنوز آماده نیست. چند لحظه صبر کن و دوباره تلاش کن.';
            }

            Future<String> askLocal(String prompt) async {
              if (!modelsReady) return offlineAnswer(prompt);
              chatHistory.add(ChatMessage(role: 'user', content: prompt));
              if (chatHistory.length > 13) {
                chatHistory.removeRange(1, chatHistory.length - 12);
              }
              final buffer = StringBuffer();
              final completer = Completer<String>();
              StreamSubscription<String>? subscription;
              subscription = llama.generateChat(
                messages: List<ChatMessage>.from(chatHistory),
                template: 'chatml',
                temperature: 0.7,
                maxTokens: 256,
              ).listen(
                (token) => buffer.write(token),
                onError: (Object error) { if (!completer.isCompleted) completer.completeError(error); },
                onDone: () { if (!completer.isCompleted) completer.complete(buffer.toString().trim()); },
              );
              try {
                final reply = await completer.future.timeout(const Duration(minutes: 2));
                await subscription.cancel();
                if (reply.isEmpty) throw Exception('مدل پاسخ خالی داد');
                chatHistory.add(ChatMessage(role: 'assistant', content: reply));
                return reply;
              } catch (_) {
                await subscription.cancel();
                if (chatHistory.length > 1) chatHistory.removeLast();
                return offlineAnswer(prompt);
              }
            }

            Future<void> send() async {
              final text = input.text.trim();
              if (text.isEmpty || thinking) return;
              input.clear(); HapticFeedback.selectionClick(); addMessage('user', text);
              final q = text.toLowerCase();
              if (await handleDeviceCommand(text)) return;
              final local = ['ساعت', 'تاریخ', 'سلام', 'درود', 'اسمت', 'نامت', 'معرفی کن', 'خودت را معرفی', 'خودتو معرفی', 'خداحافظ', 'راهنما', 'چه کار', 'وضعیت'].any(q.contains);
              if (local) { final reply = offlineAnswer(text); addMessage('jarvis', reply); await speak(reply); return; }
              if (!modelsReady) { final reply = 'مدل محلی هنوز در حال بارگذاری است؛ چند لحظه صبر کن.'; addMessage('jarvis', reply); await speak(reply); return; }
              setState(() => thinking = true);
              final reply = await askLocal(text);
              if (!mounted) return;
              setState(() => thinking = false); addMessage('jarvis', reply); await speak(reply);
            }

            Future<String> translateForTurkishSpeech(String persianText) async {
              if (!modelsReady) return 'Lütfen birkaç saniye bekleyin.';
              final buffer = StringBuffer();
              final completer = Completer<String>();
              StreamSubscription<String>? subscription;
              subscription = llama.generateChat(
                messages: [
                  ChatMessage(role: 'system', content: 'Translate the Persian text into natural, fluent Turkish as spoken in Turkey (Türkiye Türkçesi). Return only the Turkish translation. Do not explain, do not add quotation marks, and do not answer the content; translate it faithfully.'),
                  ChatMessage(role: 'user', content: persianText),
                ],
                template: 'chatml',
                temperature: 0.2,
                maxTokens: 180,
              ).listen(
                (token) => buffer.write(token),
                onError: (Object error) { if (!completer.isCompleted) completer.completeError(error); },
                onDone: () { if (!completer.isCompleted) completer.complete(buffer.toString().trim()); },
              );
              try {
                final translated = await completer.future.timeout(const Duration(seconds: 45));
                await subscription.cancel();
                return translated.isEmpty ? 'Şu anda yanıt veremiyorum.' : translated;
              } catch (_) {
                await subscription.cancel();
                return 'Yanıtınız ekranda görüntüleniyor.';
              }
            }

            Future<void> speak(String persianText) async {
              try {
                final turkishText = await translateForTurkishSpeech(persianText);
                await tts.stop();
                final available = await tts.isLanguageAvailable('tr-TR');
                if (available != true) {
                  if (!mounted) return;
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('صدای ترکی استانبولی روی گوشی موجود نیست. از تنظیمات تبدیل متن به گفتار، صدای ترکی (ترکیه) را نصب یا انتخاب کن. متن فارسی همچنان نمایش داده می‌شود.')));
                  return;
                }
                await tts.setLanguage('tr-TR');
                await tts.setSpeechRate(0.46);
                await tts.speak(turkishText);
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('پخش صدای ترکی انجام نشد. در تنظیمات تبدیل متن به گفتار گوشی، موتور و صدای ترکی استانبولی را نصب کن.')));
              }
            }

            Future<void> listen() async {
              if (listening) {
                await speechService?.stop();
                if (mounted) setState(() => listening = false);
                return;
              }
              if (speechService == null) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(speechError.isEmpty ? 'مدل تشخیص گفتار هنوز آماده نیست. وضعیت: $systemStatus' : 'مدل گفتار آماده نشد: $speechError')));
                return;
              }
              final permission = await Permission.microphone.request();
              if (!permission.isGranted) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('برای فرمان صوتی باید اجازهٔ میکروفون بدهی.')));
                return;
              }
              try {
                await speechService!.start();
                if (mounted) setState(() => listening = true);
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('شروع تشخیص گفتار ناموفق بود: $e')));
              }
            }

            Widget glassPanel({required Widget child, EdgeInsets padding = const EdgeInsets.all(14)}) => Container(
              padding: padding,
              decoration: BoxDecoration(color: panel.withValues(alpha: 0.85), borderRadius: BorderRadius.circular(18), border: Border.all(color: cyan.withValues(alpha: 0.24)), boxShadow: [BoxShadow(color: cyan.withValues(alpha: 0.05), blurRadius: 20)]),
              child: child,
            );

            Widget statusItem(IconData icon, String label, String value) => Expanded(child: glassPanel(
              padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 5),
              child: Column(children: [Icon(icon, color: cyan, size: 22), const SizedBox(height: 7), Text(label, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white60, fontSize: 10)), const SizedBox(height: 4), Text(value, textAlign: TextAlign.center, style: const TextStyle(color: cyan, fontSize: 11, fontWeight: FontWeight.bold))]),
            ));

            Widget core() => AnimatedBuilder(animation: pulse, builder: (context, child) {
              final t = pulse.value;
              return SizedBox(width: 190, height: 190, child: Stack(alignment: Alignment.center, children: [
                Container(width: 170 + t * 8, height: 170 + t * 8, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: cyan.withValues(alpha: 0.2 + t * 0.3)))),
                Transform.rotate(angle: t * 0.8, child: Container(width: 144, height: 144, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: blue.withValues(alpha: 0.8), width: 2), boxShadow: [BoxShadow(color: cyan.withValues(alpha: 0.08 + t * 0.12), blurRadius: 28, spreadRadius: 4)]))),
                Container(width: 112, height: 112, decoration: BoxDecoration(shape: BoxShape.circle, gradient: RadialGradient(colors: [cyan.withValues(alpha: 0.3), const Color(0xFF075080), const Color(0xFF061222)]), border: Border.all(color: cyan.withValues(alpha: 0.8))), child: const Icon(Icons.memory_rounded, color: cyan, size: 52)),
                Positioned(top: 12, right: 28, child: Container(width: 7, height: 7, decoration: const BoxDecoration(color: Colors.white, shape: BoxShape.circle, boxShadow: [BoxShadow(color: cyan, blurRadius: 10)]))),
              ]));
            });

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(backgroundColor: bg, title: const Row(children: [Icon(Icons.hexagon_outlined, color: cyan, size: 28), SizedBox(width: 10), Text('J.A.R.V.I.S', style: TextStyle(letterSpacing: 3, fontWeight: FontWeight.w800))]),
                actions: [Padding(padding: const EdgeInsets.only(right: 14), child: Icon(Icons.offline_bolt, color: modelsReady ? cyan : Colors.white38)), const SizedBox(width: 8)]),
              body: SafeArea(child: Column(children: [
                Expanded(child: ListView(controller: scroll, padding: const EdgeInsets.fromLTRB(16, 10, 16, 16), children: [
                  const Center(child: Text('LOCAL AI INTERFACE', style: TextStyle(color: cyan, fontSize: 10, letterSpacing: 3))),
                  const SizedBox(height: 8), Center(child: core()), const SizedBox(height: 8),
                  const Center(child: Text('هسته مرکزی جارویس', style: TextStyle(fontSize: 21, fontWeight: FontWeight.bold))), const SizedBox(height: 6),
                  Center(child: Row(mainAxisSize: MainAxisSize.min, children: [Container(width: 7, height: 7, decoration: BoxDecoration(color: modelsReady ? const Color(0xFF39FFB6) : Colors.orange, shape: BoxShape.circle)), const SizedBox(width: 7), Flexible(child: Text(thinking ? 'مدل محلی در حال پاسخ‌گویی' : listening ? 'تشخیص گفتار آفلاین فعال' : systemStatus, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white60, fontSize: 12)))])),
                  const SizedBox(height: 22), Row(children: [statusItem(Icons.memory, 'مدل زبانی', modelsReady ? 'آماده' : 'بارگذاری'), const SizedBox(width: 8), statusItem(Icons.mic_none, 'میکروفون', listening ? 'شنود' : 'آفلاین'), const SizedBox(width: 8), statusItem(Icons.wifi_off, 'شبکه', 'بدون اینترنت')]),
                  const SizedBox(height: 22), Row(children: [const Icon(Icons.terminal, color: cyan, size: 20), const SizedBox(width: 8), const Text('گزارش ارتباط', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)), const Spacer(), Text('${messages.length} پیام', style: const TextStyle(color: Colors.white38, fontSize: 11))]),
                  const SizedBox(height: 12),
                  ...messages.map((item) { final mine = item['from'] == 'user'; return Align(alignment: mine ? Alignment.centerRight : Alignment.centerLeft, child: Container(constraints: const BoxConstraints(maxWidth: 320), margin: const EdgeInsets.only(bottom: 10), padding: const EdgeInsets.all(14), decoration: BoxDecoration(color: mine ? const Color(0xFF073A59) : panel, borderRadius: BorderRadius.circular(16), border: Border.all(color: (mine ? blue : cyan).withValues(alpha: 0.3))), child: Text(item['text']!, textDirection: TextDirection.rtl, style: const TextStyle(fontSize: 15, height: 1.7)))); }),
                ])),
                Container(padding: const EdgeInsets.fromLTRB(12, 12, 12, 12), decoration: BoxDecoration(color: const Color(0xFF06111F), border: Border(top: BorderSide(color: cyan.withValues(alpha: 0.22)))), child: Row(children: [
                  Container(decoration: BoxDecoration(color: listening ? const Color(0xFF123E55) : panel, shape: BoxShape.circle, border: Border.all(color: cyan.withValues(alpha: 0.5))), child: IconButton(onPressed: listen, icon: Icon(listening ? Icons.stop : Icons.mic_none, color: cyan), tooltip: 'فرمان صوتی آفلاین')),
                  const SizedBox(width: 9),
                  Expanded(
                    child: TextField(
                      controller: input,
                      textDirection: TextDirection.rtl,
                      onSubmitted: (_) => send(),
                      decoration: InputDecoration(
                        hintText: 'فرمان خود را وارد کنید...',
                        hintStyle: const TextStyle(color: Colors.white38, fontSize: 13),
                        filled: true,
                        fillColor: panel,
                        contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 15),
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(18),
                          borderSide: BorderSide(color: cyan.withValues(alpha: 0.2)),
                        ),
                        enabledBorder: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(18),
                          borderSide: BorderSide(color: cyan.withValues(alpha: 0.2)),
                        ),
                      ),
                    ),
                  ),
                  const SizedBox(width: 9), Container(decoration: const BoxDecoration(gradient: LinearGradient(colors: [cyan, blue]), shape: BoxShape.circle), child: IconButton(onPressed: thinking ? null : send, icon: Icon(thinking ? Icons.hourglass_top : Icons.arrow_upward_rounded, color: bg), tooltip: 'ارسال فرمان')),
                ])),
              ])),
            );
          }
          DART

      - name: Build release APK
        working-directory: jarvis_app
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-persian-fully-offline-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
