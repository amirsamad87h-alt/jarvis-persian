                  border: Border.all(
                    color: cyan.withValues(alpha: 0.2 + t * 0.3),
                  ),
                ),
              ),
              Transform.rotate(
                angle: t * 0.8,
                child: Container(
                  width: 144,
                  height: 144,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    border: Border.all(
                      color: blue.withValues(alpha: 0.8),
                      width: 2,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: cyan.withValues(alpha: 0.08 + t * 0.12),
                        blurRadius: 28,
