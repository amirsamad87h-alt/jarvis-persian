class ChatPage extends StatefulWidget {
  const ChatPage({super.key});

  @override
  State<ChatPage> createState() => _ChatPageState();
}

class _ChatPageState extends State<ChatPage>
    with SingleTickerProviderStateMixin {
  final input = TextEditingController();
  final scroll = ScrollController();
  final tts = FlutterTts();
  final llama = LlamaController();
  final vosk = VoskFlutterPlugin.instance();
  final modelLoader = ModelLoader();

  final messages = <Map<String, String>>[
    {
      'from': 'jarvis',
      'text':
          'سلام! من جارویس فارسی هستم. مدل‌های آفلاین در حال آماده‌سازی هستند.',
    },
  ];

  final chatHistory = <ChatMessage>[];

  late final AnimationController pulse;

  Model? speechModel;
  Recognizer? recognizer;
  SpeechService? speechService;

  StreamSubscription<dynamic>? resultSubscription;
  StreamSubscription<dynamic>? partialSubscription;

  bool listening = false;
  bool thinking = false;
  bool modelsReady = false;

  String systemStatus = 'در حال بارگذاری مدل‌های آفلاین';

  @override
  void initState() {
    super.initState();

    pulse = AnimationController(
      vsync: this,
      duration: const Duration(milliseconds: 2200),
    )..repeat(reverse: true);

    tts.setLanguage('fa-IR');
    tts.setSpeechRate(0.45);

    initializeOfflineModels();
  }

  Future<void> initializeOfflineModels() async {
    try {
      if (mounted) {
        setState(() {
          systemStatus = 'آماده‌سازی مدل گفتار فارسی';
        });
      }

      final voskPath = await modelLoader.loadFromAssets(voskAsset);

      speechModel = await vosk.createModel(voskPath);

      recognizer = await vosk.createRecognizer(
        model: speechModel!,
        sampleRate: 16000,
      );

      speechService = await vosk.initSpeechService(recognizer!);

      resultSubscription = speechService!.onResult().listen((event) {
        final text = extractRecognizedText(event.toString());

        if (text.isNotEmpty && listening && mounted) {
          setState(() => listening = false);

          speechService?.stop();

          input.text = text;
          input.selection = TextSelection.collapsed(
            offset: input.text.length,
          );

          send();
        }
      });

      partialSubscription = speechService!.onPartial().listen((event) {
        final text = extractRecognizedText(event.toString());

        if (text.isNotEmpty && listening && mounted) {
          input.text = text;
          input.selection = TextSelection.collapsed(
            offset: input.text.length,
          );
        }
      });

      if (mounted) {
        setState(() {
          systemStatus = 'آماده‌سازی مدل زبانی محلی';
        });
      }

      final directory = await getApplicationSupportDirectory();

      final modelFile = File(
        '${directory.path}/qwen2.5-0.5b-instruct-q4_k_m.gguf',
      );

      if (!await modelFile.exists() ||
          await modelFile.length() < 400000000) {
        final data = await rootBundle.load(llmAsset);

        await modelFile.writeAsBytes(
          data.buffer.asUint8List(
            data.offsetInBytes,
            data.lengthInBytes,
          ),
          flush: true,
        );
      }

      final gpu = await llama.detectGpu();

      await llama.loadModel(
        modelPath: modelFile.path,
        threads: 4,
        contextSize: 2048,
        gpuLayers: gpu.recommendedGpuLayers,
      );

      chatHistory.add(
        ChatMessage(
          role: 'system',
          content:
              'تو JARVIS، دستیار شخصی فارسی هستی. '
              'به فارسی روان، کوتاه و مفید پاسخ بده. '
              'اگر پاسخ را نمی‌دانی، صادقانه بگو. '
              'ادعا نکن که به امکانات گوشی دسترسی داری یا کاری را '
              'انجام داده‌ای مگر واقعاً انجام شده باشد. '
              'تمام پردازش‌ها روی همین دستگاه انجام می‌شوند.',
        ),
      );

      if (!mounted) return;

      setState(() {
        modelsReady = true;
        systemStatus = 'کاملاً آفلاین و آماده';
      });

      addMessage(
        'jarvis',
        'مدل محلی بارگذاری شد. اکنون می‌توانی بدون اینترنت با من گفت‌وگو کنی.',
      );
    } catch (e) {
      if (!mounted) return;

      setState(() {
        systemStatus = 'خطا در بارگذاری مدل آفلاین';
      });

      addMessage(
        'jarvis',
        'بارگذاری مدل انجام نشد. جزئیات: $e',
      );
    }
  }

  String extractRecognizedText(String raw) {
    try {
      final value = jsonDecode(raw);

      if (value is Map) {
        return (value['text'] ?? value['partial'] ?? '')
            .toString()
            .trim();
      }
    } catch (_) {}

    return raw.trim();
  }

  @override
  void dispose() {
    resultSubscription?.cancel();
    partialSubscription?.cancel();

    speechService?.stop();
    llama.dispose();

    pulse.dispose();
    input.dispose();
    scroll.dispose();
    tts.stop();

    super.dispose();
  }

  void addMessage(String from, String text) {
    if (!mounted) return;

    setState(() {
      messages.add({
        'from': from,
        'text': text,
      });
    });

    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (scroll.hasClients) {
        scroll.animateTo(
          scroll.position.maxScrollExtent,
          duration: const Duration(milliseconds: 300),
          curve: Curves.easeOut,
        );
      }
    });
  }

  String offlineAnswer(String raw) {
    final q = raw.toLowerCase().trim();

    if (q.contains('سلام') || q.contains('درود')) {
      return 'سلام! آماده‌ام. چه کاری برایت انجام بدهم؟';
    }

    if (q.contains('اسمت') || q.contains('نامت')) {
      return 'من JARVIS هستم؛ دستیار شخصی فارسی شما.';
    }

    if (q.contains('ساعت')) {
      final n = DateTime.now();

      return 'ساعت دستگاه ${n.hour}:${n.minute.toString().padLeft(2, '0')} است.';
    }

    if (q.contains('تاریخ')) {
      final n = DateTime.now();

      return 'تاریخ دستگاه: ${n.year}/${n.month}/${n.day}';
    }

    if (q.contains('وضعیت')) {
      return 'هسته جارویس فعال است. حالت اجرا: کاملاً آفلاین. '
          'مدل زبانی: ${modelsReady ? 'آماده' : 'در حال بارگذاری'}.';
    }

    if (q.contains('راهنما') || q.contains('چه کار')) {
      return 'می‌توانم به کمک مدل محلی به سؤال‌ها پاسخ بدهم و '
          'ساعت و تاریخ دستگاه را اعلام کنم. برای گفتار فارسی، '
          'مدل آفلاین گفتار نیز همراه برنامه است.';
    }

    if (q.contains('خداحافظ')) {
      return 'خداحافظ! هر زمان نیاز داشتی برگرد.';
    }

    return 'مدل زبانی هنوز آماده نیست. چند لحظه صبر کن و دوباره تلاش کن.';
  }

  Future<String> askLocal(String prompt) async {
    if (!modelsReady) return offlineAnswer(prompt);

    chatHistory.add(
      ChatMessage(
        role: 'user',
        content: prompt,
      ),
    );

    if (chatHistory.length > 13) {
      chatHistory.removeRange(1, chatHistory.length - 12);
    }

    final buffer = StringBuffer();
    final completer = Completer<String>();

    StreamSubscription<String>? subscription;

    subscription = llama
        .generateChat(
          messages: List<ChatMessage>.from(chatHistory),
          template: 'chatml',
          temperature: 0.7,
          maxTokens: 256,
        )
        .listen(
          (token) => buffer.write(token),
          onError: (Object error) {
            if (!completer.isCompleted) {
              completer.completeError(error);
            }
          },
          onDone: () {
            if (!completer.isCompleted) {
              completer.complete(buffer.toString().trim());
            }
          },
        );

    try {
      final reply = await completer.future.timeout(
        const Duration(minutes: 2),
      );

      await subscription.cancel();

      if (reply.isEmpty) {
        throw Exception('مدل پاسخ خالی داد');
      }

      chatHistory.add(
        ChatMessage(
          role: 'assistant',
          content: reply,
        ),
      );

      return reply;
    } catch (_) {
      await subscription.cancel();

      if (chatHistory.length > 1) {
        chatHistory.removeLast();
      }

      return offlineAnswer(prompt);
    }
  }

  Future<void> send() async {
    final text = input.text.trim();

    if (text.isEmpty || thinking) return;

    input.clear();

    HapticFeedback.selectionClick();

    addMessage('user', text);

    final q = text.toLowerCase();

    final local = [
      'ساعت',
      'تاریخ',
      'سلام',
      'درود',
      'اسمت',
      'نامت',
      'خداحافظ',
      'راهنما',
      'چه کار',
      'وضعیت',
    ].any(q.contains);

    if (local) {
      final reply = offlineAnswer(text);

      addMessage('jarvis', reply);

      await speak(reply);

      return;
    }

    if (!modelsReady) {
      const reply =
          'مدل محلی هنوز در حال بارگذاری است؛ چند لحظه صبر کن.';

      addMessage('jarvis', reply);

      await speak(reply);

      return;
    }

    setState(() => thinking = true);

    final reply = await askLocal(text);

    if (!mounted) return;

    setState(() => thinking = false);

    addMessage('jarvis', reply);

    await speak(reply);
  }

  Future<void> speak(String text) async {
    try {
      await tts.stop();
      await tts.setLanguage('fa-IR');
      await tts.speak(text);
    } catch (_) {
      if (!mounted) return;

      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text(
            'صدای فارسی روی دستگاه نصب نیست. از تنظیمات تبدیل متن به گفتار، صدای فارسی آفلاین را نصب کن.',
          ),
        ),
      );
    }
  }

  Future<void> listen() async {
    if (listening) {
      await speechService?.stop();

      if (mounted) {
        setState(() => listening = false);
      }

      return;
    }

    if (speechService == null) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(
            content: Text('مدل تشخیص گفتار هنوز آماده نیست.'),
          ),
        );
      }

      return;
    }

    final permission = await Permission.microphone.request();

    if (!permission.isGranted) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(
            content: Text(
              'برای فرمان صوتی باید اجازهٔ میکروفون بدهی.',
            ),
          ),
        );
      }

      return;
    }

    try {
      await speechService!.start();

      if (mounted) {
        setState(() => listening = true);
      }
    } catch (e) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(
            content: Text('شروع تشخیص گفتار ناموفق بود: $e'),
          ),
        );
      }
    }
  }

